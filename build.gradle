plugins {
    id 'application'
}

repositories {
    mavenCentral()
}

dependencies {
    implementation "com.google.code.gson:gson:${project.deps_gson}"
    implementation "org.xerial:sqlite-jdbc:${project.deps_sqlite_jdbc}"
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of 25 
    }
}

jar {
    manifest {
        attributes 'Main-Class': 'hibiscvs.modbone.Main'
    }
    from {
        configurations.runtimeClasspath.collect { it.isDirectory()? it : zipTree(it) }
    }
}

tasks.named('jar') {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

application {
    mainClass = 'hibiscvs.modbone.Main'
}
